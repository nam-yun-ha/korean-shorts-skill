<!doctype html>
<!-- 장면 뼈대. 이중 중괄호로 감싼 자리는 build.py 가 채운다.
     ★ 이 파일을 프로젝트 루트에 두면 안 된다 — _gen/ 안에 둘 것 (루트에 .html 이 둘이면 렌더가 죽는다) -->
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face{font-family:"NotoKR";src:url("fonts/NotoSansKR-Medium.otf") format("opentype");font-weight:500;}
      @font-face{font-family:"NotoKR";src:url("fonts/NotoSansKR-Bold.otf")   format("opentype");font-weight:700;}
      @font-face{font-family:"NotoKR";src:url("fonts/NotoSansKR-Black.otf")  format("opentype");font-weight:900;}
      *{margin:0;padding:0;box-sizing:border-box}
      /* 장면 틴트: 중립 #14181A · 위기 #191416 · 혜택 #141A16 · 가치 #1A1814 */
      html,body{width:1080px;height:1920px;overflow:hidden;background:#14181A}
      body{font-family:"NotoKR",sans-serif}
      #root{position:relative;width:1080px;height:1920px;overflow:hidden}

      /* ── 무대 (풀블리드는 자식에. 루트에 걸면 렌더가 검게 나온다) ── */
      #stage{position:absolute;inset:0;background:#14181A}
      #stage .grid{position:absolute;inset:0;
        background-image:
          repeating-linear-gradient(to right,rgba(255,255,255,.045) 0 1px,transparent 1px 90px),
          repeating-linear-gradient(to bottom,rgba(255,255,255,.045) 0 1px,transparent 1px 90px);}
      #stage .pool{position:absolute;left:50%;top:40%;width:1440px;height:1440px;margin:-720px 0 0 -720px;
        background:radial-gradient(circle,rgba(255,255,255,.035) 0%,rgba(255,255,255,0) 70%);}
      #stage .grain{position:absolute;inset:0;opacity:.05;
        background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' seed='7'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>");}

      /* ── 고정 UI · 밀도에서 세지 않는다 ── */
      #ribbon{position:absolute;left:60px;top:120px;display:block}
      #ribbon .rb{height:76px;line-height:76px;background:#0CC6E4;color:#0E2A30;font-weight:700;
        font-size:40px;padding:0 46px 0 26px;white-space:nowrap;
        clip-path:polygon(0 0,100% 0,calc(100% - 24px) 50%,100% 100%,0 100%);}
      #ribbon .rbs{margin-top:10px;font-weight:500;font-size:32px;color:#0CC6E4;padding-left:26px}
      #src{position:absolute;right:60px;top:140px;display:block;
        font-weight:500;font-size:26px;letter-spacing:.04em;color:#7A7870;white-space:nowrap}

      /* ── 클레이 캐릭터 (chargen.py 가 채운다) ── */
      .ch{position:absolute;display:block}
      .ch svg{width:100%;height:100%;display:block;overflow:visible}
      .fl{stroke:#2D3748;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;fill:none}
      .drop{opacity:0}
      /* 팔 회전은 CSS 로 원점을 잡는다. GSAP svgOrigin 은 금지 */
      /* #ca-arms{transform-box:fill-box;transform-origin:50% 94%}   cheer  */
      /* #cp-arm {transform-box:fill-box;transform-origin:8% 90%}    point  */

      /* ── 자막 · 이 셋만 고정이다 ── */
      .cap-line{position:absolute;left:100px;width:880px;font-weight:700;font-size:64px;
        line-height:1.28;letter-spacing:-.01em;color:#EFE6C8;text-align:center;
        -webkit-text-stroke:3px #000;paint-order:stroke fill;}
      .cap-line b{color:#E12F2C;font-weight:700}   /* 빨강=주목 · 노랑 #EBBE2D=가치 · 녹색 #2FA85F=승리 */
      .cap-line span{display:block}
      .c1{top:1478px}   /* 한 줄 */
      .c2{top:1396px}   /* 두 줄 — 두 경우 모두 기준선 y=1560 에서 끝난다 */
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DUR}}"
         data-fps="30" data-width="1080" data-height="1920">

      <div id="stage" class="clip" data-start="0" data-duration="{{DUR}}" data-track-index="0">
        <div class="grid"></div><div class="pool"></div><div class="grain"></div>
      </div>

      <!-- ▼▼ 여기부터 매 장면 새로 짠다. 안전선 y 120~1600 사이 1480px 는 자유 ▼▼ -->
      <!-- clip 은 반드시 #root 의 직계 자식. 같은 track-index 끼리 겹치면 안 된다.
           ★ z 순서는 track-index 가 아니라 DOM 순서를 따른다.
           층 순서:  무대 → 환경/색면 → 도식 → 캐릭터 → 고정 UI → 자막 -->



      <!-- ▲▲ 여기까지 ▲▲ -->

      <!-- 고정 UI 는 DOM 맨 뒤. 앞에 두면 전면 색면·벽에 덮인다 -->
      <div id="ribbon" class="clip" data-start="{{rb_s}}" data-duration="{{rb_d}}" data-track-index="1">
        <div class="rb">장면 주제</div>
        <div class="rbs">보조 줄</div>
      </div>
      <div id="src" class="clip" data-start="{{sr_s}}" data-duration="{{sr_d}}" data-track-index="2">▶ 출처 · 연도</div>


      <div id="q1" class="cap-line c1 clip" data-start="{{q1_s}}" data-duration="{{q1_d}}" data-track-index="20">자막 한 줄</div>

      <audio id="vo" src="audio/{{SCENE}}.wav" data-start="0" data-duration="{{DUR}}" data-track-index="30"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const f = (n) => n / 30;
      const POP = { duration: f(5), ease: "power1.out", immediateRender: false };

      tl.fromTo("#ribbon", { scale: .95, y: 6 }, { scale: 1, y: 0, ...POP }, f(4));

      /* ★ fromTo 는 from 에만 쓴 속성이 CSS 초깃값으로 되돌아간다.
         opacity 를 쓸 거면 from·to 양쪽에 적는다:
           tl.fromTo(sel, {opacity:1, scale:0}, {opacity:1, scale:1, ...})   */

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
